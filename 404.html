<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    (function () {
      const repo = "ubg98.github.io";
      const path = window.location.pathname;

      // If repo name is missing, inject it
      if (!path.startsWith("/" + repo)) {
        window.location.replace(
          "/" + repo + path
        );
      }
    })();
  </script>
</head>
<body>
  Redirecting…
</body>
</html>
